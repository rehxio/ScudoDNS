name: Reportar un fallo
description: Algo no funciona como debería en ScudoDNS.
title: "[Fallo] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Antes de seguir, echa un vistazo a [Problemas frecuentes](https://github.com/rehxio/ScudoDNS/wiki/Problemas-frecuentes). El fallo más habitual, quedarse sin Internet con la protección activa, se debe al **DNS privado** de Android.

  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué ocurre?
      description: Describe el fallo y qué esperabas que pasara.
      placeholder: Al activar la protección, la app del banco no carga.
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Activo la protección
        2. Abro la app X
        3. Se queda cargando
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión de ScudoDNS
      description: La ves en ScudoDNS → Acerca de (icono ⓘ arriba).
      placeholder: "0.6.0"
    validations:
      required: true

  - type: input
    id: movil
    attributes:
      label: Móvil y versión de Android
      placeholder: Xiaomi 12T Pro, Android 14 (HyperOS)
    validations:
      required: true

  - type: dropdown
    id: red
    attributes:
      label: ¿Con qué conexión pasa?
      options:
        - Wi-Fi
        - Datos móviles
        - Con las dos
        - No lo sé
    validations:
      required: true

  - type: checkboxes
    id: comprobaciones
    attributes:
      label: Comprobaciones
      options:
        - label: El DNS privado de Android está desactivado.
          required: true
        - label: No tengo otra VPN activa (WireGuard, AdGuard, etc.).
          required: true
        - label: He buscado en las issues y no hay otra igual.
          required: true

  - type: textarea
    id: dominios
    attributes:
      label: Dominios relacionados (opcional)
      description: Si sabes qué dominio se bloquea y no debería (o al revés), búscalo en la pestaña Registro y ponlo aquí.
      placeholder: api.ejemplo.com aparece en rojo y la app deja de funcionar.

  - type: textarea
    id: capturas
    attributes:
      label: Capturas (opcional)
      description: Lo más útil es una captura de la tarjeta **Diagnóstico** (Inicio, desplegada) y otra del **Registro**. Puedes arrastrar las imágenes aquí.
