# Compila y pasa los tests en cada push y en cada pull request.
# El APK que genera sirve para probar propuestas; las versiones oficiales se publican en Releases.
name: Compilar y probar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Comprueba que gradle-wrapper.jar es el oficial de Gradle y no uno manipulado.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest
      - name: Compilar APK de prueba
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ScudoDNS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
