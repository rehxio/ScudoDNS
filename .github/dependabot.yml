# Avisa (y propone la actualización) cuando una dependencia o acción tiene versión nueva
# o una vulnerabilidad conocida.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
